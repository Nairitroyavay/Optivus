name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-check:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --concurrency=4

  firestore-rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install root dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.2

      - name: Run Firestore emulator tests
        run: npm run test:firestore

  worker-tests:
    name: Cloudflare Worker Typechecks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Coach Worker
        working-directory: workers/coach-worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test Nutrition Worker
        working-directory: workers/nutrition-worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test R2 Upload Worker
        working-directory: workers/r2-upload-worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test Routine Import Worker
        working-directory: workers/routine-import-worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test Skin Care Worker
        working-directory: workers/skin-care-worker
        run: |
          npm ci
          npm run typecheck
          npm test

name = "optivus-routine-import-worker-dev"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "optivus-lifeos"
R2_BUCKET_NAME = "optivus-uploads-dev"
MAX_IMAGE_BYTES = "15728640"
GEMINI_INLINE_MAX_IMAGE_BYTES = "11534336"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-2.5-flash"
AI_FALLBACK_MODEL = "gemini-2.5-flash"
ALLOWED_ORIGINS = ""

[secrets]
required = ["GEMINI_API_KEY"]

[[r2_buckets]]
binding = "UPLOAD_BUCKET"
bucket_name = "optivus-uploads-dev"

[observability]
enabled = true
head_sampling_rate = 1

# This staging environment is deliberately non-deployable until every
# `required-approved-*` value and the provisional Worker name are replaced
# with the exact targets recorded in the Phase 3 authorization record.
[env.staging]
name = "optivus-routine-import-worker-staging-pending-authorization"
workers_dev = true

[env.staging.vars]
FIREBASE_PROJECT_ID = "required-approved-staging-project"
R2_BUCKET_NAME = "required-approved-staging-bucket"
MAX_IMAGE_BYTES = "15728640"
GEMINI_INLINE_MAX_IMAGE_BYTES = "11534336"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-2.5-flash"
AI_FALLBACK_MODEL = "gemini-2.5-flash"
ALLOWED_ORIGINS = "https://staging-origin.invalid"

[env.staging.secrets]
required = ["GEMINI_API_KEY"]

[[env.staging.r2_buckets]]
binding = "UPLOAD_BUCKET"
bucket_name = "required-approved-staging-bucket"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
